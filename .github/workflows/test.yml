name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: posho_cereals_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5433
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: posho_cereals_test
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
      MPESA_CALLBACK_SECRET: ci-callback-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Create the database schema
        run: psql "postgresql://postgres:postgres@localhost:5433/GrainFlowTest" -v ON_ERROR_STOP=1 -f GrainFlowTest.sql

      - name: Run tests
        run: npm test
